{"id":460396100,"author":{"login":"cliffhall","id":871933,"node_id":"MDQ6VXNlcjg3MTkzMw==","gravatar_id":"","type":"User","user_view_type":"public","site_admin":false},"node_id":"RE_kwDOM7KEns4bcRZE","tag_name":"2.17.0","target_commitish":"main","name":"2.17.0","draft":false,"immutable":false,"prerelease":false,"created_at":"2026-11-27T09:32:58Z","updated_at":"2026-11-27T10:07:31Z","published_at":"2026-11-27T09:36:58Z","assets":[],"body":"## What's Changed\n\n### Security fixes\n\n2.17.0 fixes one vulnerability reported privately against v2. Upgrade with `npx @modelcontextprotocol/inspector@latest`. It also affects the deprecated v1 line, where it is fixed in 1.0.7 (`@v1-latest`).\n\n* **The SSRF guard now refuses NAT64 and other IPv4-embedding IPv6 addresses that point at cloud metadata.** It used to match IPv6 addresses by how they were written. It now parses each one and matches on its value, and re-checks the IPv4 address carried in `::ffff:0:0/96`, `64:ff9b::/96` and `64:ff9b:1::/48`. On a host with NAT64/DNS64 egress, a malicious MCP server could previously name an authorization server such as `http://[64:ff9b::a9fe:a9fe]` to reach `169.254.169.254` through the web backend or the CLIs. NAT64 addresses that embed a public IPv4 address are still allowed. ([GHSA-v2gx-m79c-pvxj](https://github.com/modelcontextprotocol/inspector/security/advisories/GHSA-v2gx-m79c-pvxj))\n\n### Other changes\n\n* Name the release:notes ledger line the release ledger by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3010\n* Filter SchemaForm enum pickers as you type (#2982) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3011\n* Fail --verify over an empty skills catalog instead of reporting Verified by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3012\n* Stop Ace's font-metrics observer raising a ResizeObserver loop error in Storybook tests (#3002) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3013\n* Send custom headers to same-origin OAuth requests (#2985) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3014\n* Bump ink to v8 and start the root react range at its peer floor (#2984) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3015\n* docs: add a config reference for the composable test server by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3016\n* Web: hold a connect until the settings write in flight settles by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3017\n* Keep custom headers on the server's origin for the SDK's own OAuth requests by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3019\n* fix(auth): per-server opt-out of the issuer metadata check for misconfigured authorization servers by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3020\n* feat(test-servers): Events extension fixture (SEP-3415, #3026 phase 0) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3033\n* fix: ignore MCP_CATALOG_PATH when --config is given by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3034\n* feat(events): core protocol layer for the Events extension (#3028) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3036\n* feat(events): subscription engine — poll and push runners, registry, relay (#3029) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3037\n* feat(web): Events tab (SEP-3415, #3026 phase 3) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3038\n* feat(events): CLI, mcpdo and TUI support for the Events extension (#3032) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3039\n* feat(events): webhook subscription management (#3031) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3040\n* test(tui): stop Ink spawning tput on every test render (#3035) by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3043\n* Events tab: subscription card polish and Subscribe/Unsubscribe by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3044\n* fix(fetchGuard): block IPv4-embedding IPv6 forms, incl. NAT64 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3050\n* Release 2.17.0 step 1: bump version to 2.17.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3047\n* docs(release): prove each package installs and starts from its own tarball before the merge by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3058\n* fix(events): send --metadata on events/stream and every request a subscription makes by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3063\n* chore(release): merge v2/main into main for v2.17.0 by @cliffhall in https://github.com/modelcontextprotocol/inspector/pull/3061\n\n\n**Full Changelog**: https://github.com/modelcontextprotocol/inspector/compare/2.16.0...2.17.0\n**Release ledger for milestone branch**: [v2/chore/milestone-merge-v2.17.0](https://claude.ai/artifact/LmtgsyR3WGo8vMWxp6rA6T)\n**Events extension (SEP-3415) spec coverage**: [Inspector Events Coverage](https://claude.ai/artifact/M7KX1wS1PnWAgLo413meTs)\n\n## Thanks for helping us improve\n\nThis release addresses issues and vulnerabilities reported by these community members. Thank you for taking the time to report them:\n\n* @holistis (#2984)\n* @KilianTheMagnificent (#3021)\n* @peter-wangxu (#2985)\n* @rabbyn (#2983)\n* @Robert-Chuvala (#2986)\n* @style-luo (#2982)\n* @aminrj (GHSA-v2gx-m79c-pvxj)\n\n\n","reactions":{"total_count":1,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":1,"rocket":0,"eyes":0},"mentions_count":8}
